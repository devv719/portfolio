name: daily commit

on:
  schedule:
    - cron: '0 23 * * *'
      timezone: 'asia/kolkata'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: create empty commit
        run: |
          git config user.name "devv719"
          git config user.email "devv719@users.noreply.github.com"
          git commit --allow-empty -m "daily commit"
          git push
          
